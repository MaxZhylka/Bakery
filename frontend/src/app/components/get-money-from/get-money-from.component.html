<div mat-dialog-title class="text-center text-[28px]">Отримати займ</div>

<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col items-center gap-6 p-6">

  <mat-form-field class="w-[300px]">
    <mat-label>Номер картки для виплати</mat-label>
    <input matInput formControlName="cardNumber">
    <mat-hint align="start">Кількість символів {{form.get('cardNumber')?.value.length }}/16</mat-hint>
    <mat-error *ngIf="form.get('cardNumber')?.hasError('required')">Це поле обов'язкове</mat-error>
    <mat-error *ngIf="form.get('cardNumber')?.hasError('pattern')">Неправильний формат картки</mat-error>
    <mat-error *ngIf="form.get('cardNumber')?.hasError('maxlength')">Кількість символів {{form.get('cardNumber')?.value.length}}/16</mat-error>
    <mat-error *ngIf="form.get('cardNumber')?.hasError('minlength')">Кількість символів {{form.get('cardNumber')?.value.length}}/16</mat-error>
  </mat-form-field>

  <div class="flex justify-center gap-4 pt-4">
    <button mat-button type="button" (click)="cancel()">Скасувати</button>
    <button mat-flat-button color="primary" type="submit">Отримати</button>
  </div>

</form>
