<div mat-dialog-title class="text-center text-[28px]">Відмовити в займі</div>

<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col items-center gap-6 p-6">

  <mat-form-field class="w-[300px]">
    <mat-label>Причина відмови</mat-label>
    <textarea matInput formControlName="rejectionReason"> </textarea>
    <mat-error *ngIf="form.get('rejectionReason')?.hasError('maxlength')">Кількість символів {{form.get('cardNumber')?.value.length}}/16</mat-error>
  </mat-form-field>

  <div class="flex justify-center gap-4 pt-4">
    <button mat-button type="button" (click)="cancel()">Скасувати</button>
    <button mat-flat-button color="primary" type="submit">Відмовити</button>
  </div>

</form>
