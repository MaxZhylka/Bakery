<div mat-dialog-title class="text-center text-[28px]">Оформити займ</div>

<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col items-center gap-6 p-6">
  <mat-form-field class="w-[300px]">
    <mat-label>Сума</mat-label>
    <input matInput formControlName="value" type="number">
    <mat-error *ngIf="form.get('value')?.hasError('required')">Вкажіть суму</mat-error>
    <mat-error *ngIf="form.get('value')?.hasError('max')">Максимум 20000</mat-error>
  </mat-form-field>

  <mat-form-field class="w-[300px]">
    <mat-label>Термін</mat-label>
    <mat-select formControlName="term">
      @for (option of loanTerms; track option.value) {
        <mat-option [value]="option.value">{{ option.label }}</mat-option>
      }
    </mat-select>
    <mat-error *ngIf="form.get('term')?.hasError('required')">Оберіть термін</mat-error>
  </mat-form-field>

  <div class="text-center text-[18px] flex flex-col gap-2">
    <p>Кількість платежів: {{ getCount() }}</p>
    <p>Розмір платежу: {{ getPaymentSize() | currency:'UAH':'symbol':'1.2-2':'uk-UA'}}</p>
    <p>Відсоток: {{ getPercent() }}%</p>
  </div>

  <div class="flex justify-center gap-4 pt-4">
    <button mat-button type="button" (click)="cancel()">Скасувати</button>
    <button mat-flat-button color="primary" type="submit">Оформити</button>
  </div>
</form>
