<h2 class="text-center mt-10">Список оплат</h2>
<div class="m-5 p-5 flex border flex-col justify-center mat-elevation-z8">
  <table mat-table [dataSource]="dataSource">

    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> № </th>
      <td mat-cell *matCellDef="let element; let index = index"> {{ index + 1 }} </td>
    </ng-container>

    <ng-container matColumnDef="userId">
      <th mat-header-cell *matHeaderCellDef> Користувач </th>
      <td mat-cell *matCellDef="let element"> {{ element.userId }} </td>
    </ng-container>

    <ng-container matColumnDef="value">
      <th mat-header-cell *matHeaderCellDef> Сума </th>
      <td mat-cell *matCellDef="let element"> {{ element.value }} </td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef> Статус </th>
      <td mat-cell *matCellDef="let element"> {{ element.status }} </td>
    </ng-container>

    <ng-container matColumnDef="createdAt">
      <th mat-header-cell *matHeaderCellDef> Дата оплати </th>
      <td mat-cell *matCellDef="let element">
        {{ element.createdAt | date:'dd.MM.yyyy HH:mm:ss' }}
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Дії </th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button matTooltip="Видалити" (click)="deletePayment(element)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator
    [length]="totalSize"
    [pageSize]="paginationParams.size"
    [pageSizeOptions]="[5, 10, 20]"
    (page)="onPageChange($event)">
</mat-paginator>
